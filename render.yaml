services:
  - type: web
    name: directo-cafe
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./deploy/Dockerfile.render
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Postgres
        sync: false
      - key: Jwt__SigningKey
        generateValue: true
      - key: Uploads__Provider
        value: Supabase
      - key: Uploads__SupabaseUrl
        sync: false
      - key: Uploads__SupabaseKey
        sync: false
      - key: Uploads__Bucket
        value: product-images
      - key: Email__Provider
        value: Disabled
